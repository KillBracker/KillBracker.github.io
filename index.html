<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KillBracker | Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* === 0. ПЕРЕМЕННЫЕ ТЕМ === */
        :root {
            --bg-gradient: linear-gradient(125deg, #0b0f19 0%, #180c2e 30%, #2a1b5c 60%, #00d4ff 100%);
            --text-main: #ffffff; --text-sub: #8b9bb4;
            --card-bg: rgba(20, 23, 35, 0.75); --card-border: rgba(255, 255, 255, 0.08);
            --btn-bg: rgba(255, 255, 255, 0.05); --btn-hover: rgba(255, 255, 255, 0.15);
            --particle-color: rgba(255, 255, 255, 0.5); --blob-opacity: 0.6;
        }
        body.light-theme {
            --bg-gradient: linear-gradient(125deg, #f5f7fa 0%, #c3cfe2 100%);
            --text-main: #2c3e50; --text-sub: #546e7a;
            --card-bg: rgba(255, 255, 255, 0.8); --card-border: rgba(0, 0, 0, 0.05);
            --btn-bg: rgba(0, 0, 0, 0.05); --btn-hover: rgba(0, 0, 0, 0.1);
            --particle-color: rgba(0, 0, 0, 0.3); --blob-opacity: 0.3;
        }

        /* === ОСНОВА === */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-gradient); background-size: 300% 300%; background-attachment: fixed; animation: deepGradient 15s ease infinite; color: var(--text-main); overflow-x: hidden; overflow-y: auto; user-select: none; transition: background 0.5s ease, color 0.5s ease; position: relative; }
        @keyframes deepGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        /* Блобы и шум (На ПК) */
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; transition: transform 0.2s ease-out, opacity 0.5s; opacity: var(--blob-opacity); position: fixed; }
        .blob-1 { top: 10%; left: 10%; width: 400px; height: 400px; background: #2a1b5c; }
        .blob-2 { bottom: 10%; right: 10%; width: 350px; height: 350px; background: #00d4ff; opacity: 0.4; }
        .blob-3 { top: 40%; left: 40%; width: 300px; height: 300px; background: #ff0055; opacity: 0.2; }
        .noise-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; opacity: 0.06; background-image: url("https://grainy-gradients.vercel.app/noise.svg"); }

        /* === ГЛАВНЫЙ КОНТЕЙНЕР === */
        .main-wrapper { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; width: 100%; position: relative; z-index: 10; }

        /* === КАРТОЧКИ === */
        .glass-card {
            position: relative; background: var(--card-bg);
            /* Размытие - на ПК */
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border-radius: 24px; border: 1px solid var(--card-border);
            padding: 50px 40px 30px 40px; text-align: center;
            max-width: 600px; width: 100%;
            margin-bottom: 30px; 
            transform-style: preserve-3d; transition: border 0.5s;
        }

        /* === ПРОФИЛЬ === */
        .boss-bar-container { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,0.1); border-radius: 24px 24px 0 0; overflow: hidden; opacity: 0; transition: opacity 0.5s; z-index: 100; }
        .boss-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #ff3333, #ff0055); transition: width 0.1s linear; }

        .ui-controls { position: fixed; top: 20px; right: 20px; z-index: 101; }
        .icon-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--text-main); font-size: 1.2em; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; cursor: pointer; }
        .icon-btn:hover { transform: scale(1.1); background: var(--btn-hover); }

        .music-wrapper { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 10px; transform: translateZ(50px); z-index: 101; }
        .music-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 1.2em; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; transition: 0.3s; display: flex; align-items: center; justify-content: center; animation: pulseBtn 2s infinite; }
        .music-active { background: #5865F2; border-color: #5865F2; animation: none; box-shadow: 0 0 15px rgba(88, 101, 242, 0.6); }
        @keyframes pulseBtn { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.2); } 70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }
        .volume-slider { width: 0; opacity: 0; height: 10px; background: rgba(0, 0, 0, 0.5); border-radius: 6px; -webkit-appearance: none; outline: none; transition: 0.4s ease; margin-right: 5px; cursor: pointer; border: 2px solid #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; cursor: pointer; border: 2px solid #5865F2; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .music-wrapper.active .volume-slider { width: 80px; opacity: 1; }

        .avatar { position: relative; z-index: 10; width: auto; max-width: 100%; max-height: 250px; height: auto; display: block; margin: 10px auto 10px auto; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); transition: transform 0.05s, filter 0.3s; transform: translateZ(20px); cursor: pointer; -webkit-user-drag: none; will-change: transform; }
        .avatar:active { transform: scale(0.95) translateZ(20px); }
        .avatar.hit { filter: brightness(1.5) sepia(1) hue-rotate(-50deg) saturate(3); }
        .rage-mode { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both infinite; border: 2px solid red; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        h1 { margin: 0; font-size: 2.2em; font-weight: 800; letter-spacing: -1px; transform: translateZ(15px); color: var(--text-main); }
        .subtitle { font-size: 1em; color: var(--text-sub); margin: 5px 0 10px 0; transform: translateZ(12px); }
        .typewriter { font-size: 1.1em; color: #66c0f4; margin: 0 0 25px 0; min-height: 1.5em; font-weight: 600; transform: translateZ(12px); }
        .status-box { background: rgba(0,0,0,0.05); border: 1px solid var(--card-border); border-radius: 12px; padding: 15px; margin-bottom: 25px; font-size: 0.85em; color: var(--text-main); text-align: left; transform: translateZ(10px); display: flex; flex-direction: column; gap: 8px; }
        .song-name { color: #66c0f4; font-weight: 600; }
        
        .links { display: flex; flex-direction: row; width: 100%; gap: 12px; transform: translateZ(30px); margin-bottom: 25px; }
        .btn { text-decoration: none; color: var(--text-main); padding: 12px 10px; border-radius: 14px; transition: 0.3s; font-weight: 600; flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--btn-bg); border: 1px solid var(--card-border); backdrop-filter: blur(5px); cursor: pointer; white-space: nowrap; min-width: 0; font-size: 0.95em; }
        .btn:hover { background: var(--btn-hover); transform: translateY(-2px); }
        .tg-btn:hover { border-color: #2AABEE; box-shadow: 0 0 20px rgba(42, 171, 238, 0.2); }
        .steam-btn:hover { border-color: #171a21; box-shadow: 0 0 20px rgba(102, 192, 244, 0.2); }
        .ds-btn:hover { border-color: #5865F2; box-shadow: 0 0 20px rgba(88, 101, 242, 0.2); }

        #combo-counter { position: absolute; top: 60px; right: -20px; font-size: 1.5em; font-weight: 900; color: #ffd700; transform: rotate(15deg) translateZ(50px); opacity: 0; transition: opacity 0.2s; text-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; z-index: 102; }
        #finish-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) translateZ(60px); font-size: 3em; font-weight: 900; color: #ff0000; text-transform: uppercase; text-shadow: 0 0 20px black; opacity: 0; pointer-events: none; z-index: 103; width: 100%; text-align: center; }
        .blink { animation: blinker 0.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        .float-dmg { position: absolute; font-weight: bold; pointer-events: none; animation: floatUp 0.6s ease-out forwards; font-size: 1.5em; z-index: 200; text-shadow: 0 0 3px rgba(0,0,0,0.8); }
        .crit { color: #ff0000; font-size: 2em; text-shadow: 0 0 10px red; }
        .miss { color: #aaa; font-size: 1.2em; }
        .normal { color: #ffaa00; }
        @keyframes floatUp { 100% { opacity: 0; transform: translateY(-80px) scale(1.2); } }

        #reward-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; background: radial-gradient(circle, #ffd700 0%, #ff8c00 100%); flex-direction: column; justify-content: center; align-items: center; animation: fadeIn 1s forwards; padding: 20px; text-align: center; }
        
        .gold-chest { background: white; color: #d35400; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .diamond-chest { background: linear-gradient(135deg, #e0f7fa 0%, #00e5ff 100%); color: #006064; border: 2px solid white; box-shadow: 0 0 40px #00e5ff; text-shadow: 0 0 5px white; }

        .giant-chest-btn { font-size: 2em; padding: 20px 40px; border: none; border-radius: 20px; text-decoration: none; animation: chestBounce 1s infinite alternate; cursor: pointer; margin-bottom: 20px; display: inline-block; font-weight: 800; transition: 0.3s; }
        .back-btn { font-size: 1.2em; padding: 10px 30px; background: rgba(0,0,0,0.2); color: white; border: 2px solid white; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .back-btn:hover { background: white; color: #333; }
        
        #final-gif-el, #secret-gif-el { max-width: 300px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; }
        @keyframes chestBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Декор */
        .corner-gif { position: fixed; bottom: 20px; right: 20px; width: 120px; height: auto; z-index: 20; pointer-events: none; transition: 0.3s; }
        .bottom-banner { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; margin-top: 20px; border: 1px solid var(--card-border); box-shadow: 0 4px 15px rgba(0,0,0,0.3); transform: translateZ(5px); cursor: pointer; transition: transform 0.2s; will-change: transform; }
        .bottom-banner:hover { transform: translateZ(5px) scale(1.02); }

        #banner-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; background: rgba(0,0,0,0.95); flex-direction: column; justify-content: center; align-items: center; animation: fadeIn 0.3s forwards; }
        .banner-modal-content { max-width: 95%; max-height: 80vh; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .modal-download-btn { margin-top: 20px; padding: 12px 25px; background: #5865F2; color: white; text-decoration: none; border-radius: 20px; font-weight: bold; font-size: 1.1em; display: flex; align-items: center; gap: 10px; transition: 0.3s; border: 2px solid rgba(255,255,255,0.2); }
        .modal-download-btn:hover { background: #4752c4; transform: scale(1.05); }
        .banner-close-btn { position: absolute; top: 20px; right: 30px; font-size: 3em; color: white; cursor: pointer; transition: 0.3s; z-index: 10001; }
        .banner-close-btn:hover { color: #ff3333; }

        /* Галерея */
        .gallery-title { font-size: 1.5em; margin-bottom: 20px; color: var(--text-main); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; }
        
        /* Оптимизированная карточка галереи */
        .gallery-item { 
            position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1 / 1; 
            border: 1px solid var(--card-border); background: rgba(0,0,0,0.1); 
            will-change: transform; transform: translateZ(0); transition: transform 0.3s; 
        }
        .gallery-item:hover { transform: scale(1.03); z-index: 5; }
        .gallery-img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        /* === 📱 МОЩНАЯ ОПТИМИЗАЦИЯ ДЛЯ IOS (Anti-Lag) === */
        @media (max-width: 768px) {
            /* 1. Отключаем размытие (самое тяжелое) */
            .glass-card { 
                backdrop-filter: none !important; -webkit-backdrop-filter: none !important; 
                background: rgba(20, 23, 35, 0.96); /* Непрозрачный темный фон */
                border: 1px solid rgba(255,255,255,0.1);
                box-shadow: none;
                padding: 30px 20px; width: 95%; 
            }
            body.light-theme .glass-card {
                background: rgba(255, 255, 255, 0.96); /* Непрозрачный светлый фон */
            }
            
            /* 2. Отключаем тяжелые фоновые анимации */
            .blob, .noise-overlay { display: none !important; }
            
            /* 3. Упрощаем кнопки */
            .btn { backdrop-filter: none; background: rgba(255,255,255,0.1); width: 100%; padding: 14px; font-size: 1em; }
            
            /* Адаптация */
            h1 { font-size: 1.8em; } 
            .corner-gif { width: 90px; bottom: 10px; right: 10px; }
            .links { flex-direction: column; } 
            .ui-controls { right: auto; left: 15px; top: 15px; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body class="dark-theme">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="noise-overlay"></div>
    <canvas id="particles-canvas"></canvas>

    <img src="" class="corner-gif" id="corner-gif-el" alt="Sticker">

    <div class="ui-controls">
        <button class="icon-btn theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
    </div>
    
    <audio id="bg-music" loop src="song.mp3"></audio>

    <div id="reward-overlay">
        <h1 id="reward-title-el" style="font-size: 2.5em; color: white; margin-bottom: 30px; text-shadow: 0 5px 10px rgba(0,0,0,0.2);">ТВОЯ НАГРАДА</h1>
        
        <img src="" id="secret-gif-el">

        <a id="reward-btn-el" target="_blank" class="giant-chest-btn gold-chest">🎁 ОТКРЫТЬ</a>
        
        <br>
        <button class="back-btn" onclick="closeReward()">Вернуться на сайт</button>
    </div>

    <div id="banner-modal">
        <span class="banner-close-btn" onclick="closeBannerModal()">×</span>
        <img class="banner-modal-content" id="banner-modal-img">
        <a href="#" id="modal-download" class="modal-download-btn" download>⬇️ Скачать оригинал</a>
    </div>

    <div class="main-wrapper">

        <div class="glass-card" id="main-card">
            
            <div class="boss-bar-container" id="boss-container">
                <div class="boss-hp" id="hp-bar"></div>
            </div>

            <div class="music-wrapper" id="music-wrapper">
                <input type="range" class="volume-slider" id="vol-slider" min="0" max="1" step="0.01" value="0.5">
                <button class="music-btn" onclick="toggleMusic()" id="music-btn-el">🎵</button>
            </div>

            <div id="combo-counter">x1</div>
            <div id="finish-text">FINISH HIM!</div>

            <img src="avatar.gif" alt="Avatar" class="avatar" id="boss-avatar" onclick="hitBoss(event)" onerror="this.src='https://via.placeholder.com/150?text=No+Gif';">
            
            <h1 id="name-el"></h1>
            <p class="subtitle" id="subtitle-el"></p>
            
            <div class="typewriter" id="typing-text"></div>

            <div class="status-box">
                <div class="status-row">
                    <span>🎵</span>
                    <span>Сейчас слушаю: <span class="song-name" id="current-song">Загрузка...</span></span>
                </div>
                <div class="status-row">
                    <span id="theme-icon">🌙</span>
                    <span id="theme-text">Режим: Ночной</span>
                </div>
            </div>

            <div class="links" id="links-container"></div>

            <img src="" class="bottom-banner" id="bottom-banner-el" alt="Banner" onclick="openBannerModal(this.src)">
        </div>

        <div class="glass-card" id="gallery-card">
            <div class="gallery-title">Мои работы</div>
            <div class="gallery-grid" id="gallery-container"></div>
        </div>

    </div>

    <script type="text/javascript">
        if (window.innerWidth > 768) {
            VanillaTilt.init(document.querySelector("#main-card"), { max: 5, speed: 1000, glare: true, "max-glare": 0.1 });
        }
    </script>

    <script>
        // =================================================================
        // ⚙️ CONFIG
        // =================================================================
        const CONFIG = {
            name: "KillBracker",
            subtitle: "Люблю музыку и экспериментирую",

            // 4 ФАЙЛА ГИФОК (ЗАГРУЗИ ИХ!)
            avatarGif1: "avatar.gif",       // Гифка №1 (Начало)
            avatarGif2: "boss2.gif",        // Гифка №2 (Второй босс)
            secretRewardGif: "secret.gif",  // Гифка №3 (В сундуке)
            finalSiteGif: "final.gif",      // Гифка №4 (На сайте в конце)

            // Декор
            cornerGif: "sticker.gif",       
            bottomImage: "banner.jpg",

            // ГАЛЕРЕЯ (Добавь свои файлы!)
            gallery: [
                { src: "pixel-wall-6eaacc58-7fca-47f3-aa9c-9fb6fd16bbf1.png" },
                { src: "pixel-wall-1969b593-7765-4622-8a52-5482f9fa34e7.png" },
                { src: "pixel-wall-3198a76c-431f-48c2-950a-64041375203e.png" },
                { src: "pixel-wall-fc92f789-a639-417d-9088-b6051eeb001f.png" },
                { src: "pixel-wall-2059f812-eec5-4037-8eb8-27dbb2849167.png" },
                { src: "e3ca9315-53d9-43c5-810a-31610674950f.png" },
                { src: "f273c220-0e06-447e-bc0e-cb399178c300.png" },
                { src: "234a064f-b2c4-4c0a-af28-a49c9b23020a.png" }
            ],

            typingWords: [ "Lonely Observer 👀", "Stand User ", "Интеллектуалыч 🧠" ],

            songs: [
                "Die With A Smile — Lady Gaga & Bruno Mars", "Running Up That Hill — Kate Bush", "End of Beginning — Djo", 
                "we fell in love in october — girl in red", "16 Lines — Lil Peep", "Hope — XXXTENTACION", 
                "カーストルーム — ZAQ", "Dance In The Game — ZAQ", "Atlantis — Seafret", 
                "Moog City 2 — C418", "SAVIOR — Hollywood Undead", "Skyfall — Adele", "Daylight — David Kushner", "怪獣 — sakanaction"
            ],

            links: [
                { text: "✈️ Telegram", url: "https://t.me/KillBracker", class: "tg-btn" },
                { text: "🎮 Steam", url: "https://steamcommunity.com/id/lonelyobserver/", class: "steam-btn" },
                { text: "👾 Discord", url: "https://discord.com/users/296367874933784579", class: "ds-btn" }
            ],

            rewardLink: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        };
        // =================================================================

        // INIT UI
        document.getElementById('name-el').innerText = CONFIG.name;
        document.getElementById('subtitle-el').innerText = CONFIG.subtitle;
        
        const gifEl = document.getElementById('corner-gif-el');
        const banEl = document.getElementById('bottom-banner-el');
        const modalImg = document.getElementById('banner-modal-img');
        const secretGifEl = document.getElementById('secret-gif-el');
        const modalDownload = document.getElementById('modal-download');

        gifEl.src = CONFIG.cornerGif; banEl.src = CONFIG.bottomImage; secretGifEl.src = CONFIG.secretRewardGif;
        gifEl.onerror = () => gifEl.src = "https://media.tenor.com/On7kb94lM60AAAAj/pepe-dance.gif";
        banEl.onerror = () => { banEl.src = "https://via.placeholder.com/600x338?text=Banner+16:9"; };
        secretGifEl.onerror = () => secretGifEl.src = "https://media.tenor.com/M_Y7yowV4rQAAAAM/cat-vibe.gif";

        // GALLERY GEN (БЕЗ КНОПКИ СКАЧИВАНИЯ НА ПЛИТКАХ)
        const galleryContainer = document.getElementById('gallery-container');
        if(CONFIG.gallery.length > 0) {
            CONFIG.gallery.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.src}" class="gallery-img" onclick="openBannerModal('${item.src}')" onerror="this.src='https://via.placeholder.com/300?text=Art'">
                `;
                galleryContainer.appendChild(div);
            });
        } else { document.getElementById('gallery-card').style.display = 'none'; }

        function openBannerModal(src) { 
            const imgSrc = src || banEl.src;
            modalImg.src = imgSrc; 
            modalDownload.href = imgSrc;
            document.getElementById('banner-modal').style.display = 'flex'; 
        }
        function closeBannerModal() { document.getElementById('banner-modal').style.display = 'none'; }

        const linksContainer = document.getElementById('links-container');
        CONFIG.links.forEach(link => {
            const a = document.createElement('a'); a.href = link.url; a.target = "_blank"; a.className = `btn ${link.class}`; a.innerText = link.text;
            a.addEventListener('mouseenter', sfxHover); linksContainer.appendChild(a);
        });

        // AUDIO
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function sfxClick() { playTone(600, 'triangle', 0.1); }
        function sfxCrit() { playTone(150, 'sawtooth', 0.2); playTone(800, 'square', 0.1); }
        function sfxMiss() { playTone(200, 'sine', 0.1); }
        function sfxHover() { playTone(1200, 'sine', 0.05); }

        const bgMusic = document.getElementById('bg-music');
        const musicBtnEl = document.getElementById('music-btn-el');
        const slider = document.getElementById('vol-slider');
        const musicWrapper = document.getElementById('music-wrapper');
        let isPlaying = false; bgMusic.volume = 0.5;

        function toggleMusic() {
            if (isPlaying) { bgMusic.pause(); musicBtnEl.innerText = '🎵'; musicBtnEl.classList.remove('music-active'); musicWrapper.classList.remove('active'); } 
            else { bgMusic.play().catch(e => console.log('Audio blocked')); musicBtnEl.innerText = '⏸️'; musicBtnEl.classList.add('music-active'); musicWrapper.classList.add('active'); }
            isPlaying = !isPlaying;
        }
        slider.addEventListener('input', (e) => bgMusic.volume = e.target.value);

        const words = CONFIG.typingWords; let i = 0; let timer;
        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) { document.getElementById('typing-text').innerHTML += word.shift(); } 
                else { setTimeout(deletingEffect, 2000); return false; }; timer = setTimeout(loopTyping, 100); 
            }; loopTyping();
        }
        function deletingEffect() {
            let word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) { word.pop(); document.getElementById('typing-text').innerHTML = word.join(""); } 
                else { if (words.length > (i + 1)) { i++; } else { i = 0; } typingEffect(); return false; }; timer = setTimeout(loopDeleting, 50); 
            }; loopDeleting();
        }
        typingEffect();

        function toggleTheme() {
            document.body.classList.toggle('light-theme'); const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark'); updateThemeUI(isLight); sfxClick();
        }
        function updateThemeUI(isLight) {
            const btn = document.getElementById('theme-btn'); const icon = document.getElementById('theme-icon'); const text = document.getElementById('theme-text');
            if (isLight) { btn.innerText = '☀️'; icon.innerText = '☀️'; text.innerText = 'Режим: Дневной'; } 
            else { btn.innerText = '🌙'; icon.innerText = '🌙'; text.innerText = 'Режим: Ночной'; }
        }
        const savedTheme = localStorage.getItem('theme'); if (savedTheme === 'light') { document.body.classList.add('light-theme'); updateThemeUI(true); }

        const canvas = document.getElementById('particles-canvas'); const ctx = canvas.getContext('2d');
        let particles = []; function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        class Particle {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speedX = Math.random() * 0.5 - 0.25; this.speedY = Math.random() * 0.5 - 0.25; }
            update(mouseX, mouseY) {
                this.x += this.speedX; this.y += this.speedY;
                if (window.innerWidth > 768) { const dx = mouseX - this.x; const dy = mouseY - this.y; const dist = Math.sqrt(dx*dx + dy*dy); if (dist < 100) { this.x -= dx * 0.05; this.y -= dy * 0.05; } }
                if (this.x < 0) this.x = canvas.width; if (this.x > canvas.width) this.x = 0; if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0;
            }
            draw() { ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--particle-color'); ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        // Меньше частиц на мобилках
        const particleCount = window.innerWidth > 768 ? 40 : 15;
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        let mouseX = 0, mouseY = 0; window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(mouseX, mouseY); p.draw(); }); requestAnimationFrame(animateParticles); }
        animateParticles();

        let hp = 100; const maxHp = 100; let started = false; let combo = 0; let lastClickTime = 0; let currentBossLevel = 1;
        function hitBoss(e) {
            if (hp <= 0) return;
            if (!started) { started = true; document.getElementById('boss-container').style.opacity = 1; }
            const now = Date.now(); if (now - lastClickTime < 1000) combo++; else combo = 1; lastClickTime = now; updateComboUI();
            const rand = Math.random(); let dmg = 1; let type = 'normal'; let text = '-1';
            if (rand < 0.15) { dmg = 0; type = 'miss'; text = 'MISS'; sfxMiss(); }
            else if (rand > 0.85) { dmg = 2; type = 'crit'; text = 'CRIT -2'; sfxCrit(); document.getElementById('main-card').classList.add('rage-mode'); setTimeout(() => document.getElementById('main-card').classList.remove('rage-mode'), 200); } 
            else { sfxClick(); }
            hp -= dmg; if (hp < 0) hp = 0; document.getElementById('hp-bar').style.width = (hp / maxHp * 100) + '%';
            const avatar = document.getElementById('boss-avatar'); const finishText = document.getElementById('finish-text');
            avatar.classList.add('hit'); setTimeout(() => avatar.classList.remove('hit'), 100);
            if (hp < maxHp * 0.4) avatar.classList.add('rage-mode');
            if (hp < maxHp * 0.1 && hp > 0) { finishText.style.opacity = 1; finishText.classList.add('blink'); if (isPlaying) bgMusic.playbackRate = 0.8; } 
            else { finishText.style.opacity = 0; }
            showFloatText(e.clientX || window.innerWidth/2, e.clientY || window.innerHeight/2, text, type);
            if (hp <= 0) winGame();
        }
        function updateComboUI() { const el = document.getElementById('combo-counter'); if (combo > 1) { el.innerText = 'x' + combo; el.style.opacity = 1; el.style.transform = `rotate(${Math.random()*20-10}deg) scale(${1 + combo/50})`; } else { el.style.opacity = 0; } }
        function showFloatText(x, y, text, type) { const el = document.createElement('div'); el.className = `float-dmg ${type}`; el.innerText = text; el.style.left = x + 'px'; el.style.top = y + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), 600); }
        
        function winGame() { 
            document.getElementById('finish-text').style.display = 'none'; 
            document.getElementById('boss-avatar').style.display = 'none'; 
            playTone(400, 'sine', 0.1); setTimeout(() => playTone(600, 'sine', 0.2), 150); 
            launchConfetti(); 
            
            const title = document.getElementById('reward-title-el');
            const btn = document.getElementById('reward-btn-el');
            const secretGif = document.getElementById('secret-gif-el');
            title.style.display = 'block'; btn.style.display = 'inline-block'; secretGif.style.display = 'none';

            if (currentBossLevel === 1) {
                title.innerText = "ТВОЯ НАГРАДА"; btn.className = "giant-chest-btn gold-chest"; btn.href = CONFIG.rewardLink; btn.innerText = "🎁 ОТКРЫТЬ"; btn.onclick = null;
            } else {
                title.innerText = "СУПЕР НАГРАДА"; btn.className = "giant-chest-btn diamond-chest"; btn.removeAttribute('href'); btn.innerText = "💎 ОТКРЫТЬ";
                btn.onclick = function() {
                    this.innerText = "тут ничего нет..."; this.style.background = "#333"; this.style.color = "#aaa"; this.style.cursor = "default"; this.style.animation = "none"; this.style.boxShadow = "none"; this.style.border = "2px solid #555";
                    setTimeout(() => {
                        this.innerText = "Продолжить ➡️"; this.style.background = "#fff"; this.style.color = "#333"; this.style.cursor = "pointer"; this.style.border = "2px solid white";
                        this.onclick = function() { this.style.display = 'none'; title.style.display = 'none'; secretGif.style.display = 'block'; };
                    }, 1500);
                };
            }
            setTimeout(() => { document.getElementById('reward-overlay').style.display = 'flex'; }, 800); 
        }

        function closeReward() { 
            document.getElementById('reward-overlay').style.display = 'none'; 
            document.getElementById('boss-avatar').classList.remove('rage-mode');
            document.getElementById('boss-container').style.opacity = 0; 
            
            if (currentBossLevel === 1) {
                currentBossLevel = 2; hp = 500; maxHp = 500; document.getElementById('boss-avatar').src = CONFIG.avatarGif2; document.getElementById('boss-avatar').style.display = 'block'; started = false;
            } else if (currentBossLevel === 2) {
                currentBossLevel = 3; document.getElementById('boss-avatar').src = CONFIG.finalSiteGif; document.getElementById('boss-avatar').style.display = 'block'; hp = 0; document.getElementById('boss-avatar').onclick = null; document.getElementById('boss-avatar').style.cursor = "default";
            }
            document.getElementById('hp-bar').style.width = '100%';
        }

        if (window.innerWidth > 600) { window.addEventListener('mousemove', (e) => { const x = (window.innerWidth - e.clientX * 2) / 100; const y = (window.innerHeight - e.clientY * 2) / 100; document.querySelector('.blob-1').style.transform = `translate(${x}px, ${y}px)`; document.querySelector('.blob-2').style.transform = `translate(${-x}px, ${-y}px)`; }); }
        function launchConfetti() { var end = Date.now() + (3 * 1000); (function frame() { confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } }); confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } }); if (Date.now() < end) requestAnimationFrame(frame); }()); }
        const songsList = CONFIG.songs;
        function changeSong() { const el = document.getElementById('current-song'); el.style.opacity = 0; setTimeout(() => { el.innerText = songsList[Math.floor(Math.random() * songsList.length)]; el.style.opacity = 1; }, 300); }
        setInterval(changeSong, 120000); changeSong();
    </script>
</body>
</html>
