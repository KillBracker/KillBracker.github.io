<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KillBracker | Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* === 1. НОВЫЙ ИНТЕРЕСНЫЙ ФОН (Deep Cyberpunk) === */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Глубокий сложный градиент */
            background: linear-gradient(125deg, #0b0f19 0%, #180c2e 30%, #2a1b5c 60%, #00d4ff 100%);
            background-size: 300% 300%;
            animation: deepGradient 10s ease infinite;
            color: white;
            overflow-x: hidden;
            user-select: none;
            transition: background 1s ease;
        }

        @keyframes deepGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* === ФОН ДЛЯ 10 УРОВНЯ (Luxury Gold) === */
        body.gold-mode {
            /* Радиальный градиент: Свет идет из центра */
            background: radial-gradient(circle at center, #ffd700 0%, #d4af37 40%, #5e4b06 100%);
            background-size: 200% 200%;
            animation: goldPulse 5s ease infinite;
        }
        @keyframes goldPulse {
            0% { background-size: 200% 200%; }
            50% { background-size: 250% 250%; }
            100% { background-size: 200% 200%; }
        }

        /* КАРТОЧКА */
        .glass-card {
            position: relative;
            background: rgba(18, 20, 30, 0.75); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            transform-style: preserve-3d;
            transform: perspective(1000px);
            transition: border 0.5s ease, box-shadow 0.5s ease;
            margin: 20px 0;
        }

        .glass-card.gold-border {
            border: 2px solid #ffd700;
            background: rgba(40, 30, 10, 0.85); /* Чуть теплее фон карточки */
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }

        /* === 2. ЗАМЕТНАЯ КНОПКА МУЗЫКИ === */
        .music-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateZ(30px); /* Выпирает вперед */
            z-index: 20;
        }

        .music-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1.4em;
            cursor: pointer;
            width: 45px; /* Увеличили размер */
            height: 45px;
            border-radius: 50%;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Пульсация, чтобы привлечь внимание */
            animation: pulseBtn 2s infinite; 
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .music-btn:hover { background: rgba(102, 192, 244, 0.6); transform: scale(1.1); }
        
        .music-active { 
            background: #5865F2; 
            box-shadow: 0 0 20px #5865F2;
            border-color: #5865F2;
            animation: none; /* Перестает пульсировать при включении */
        }

        /* === 3. МИНИ-ПЛЕЕР (ЭКВАЛАЙЗЕР) === */
        .mini-player {
            display: flex;
            gap: 3px;
            height: 20px;
            align-items: flex-end;
            opacity: 0; /* Скрыт по умолчанию */
            transition: opacity 0.3s;
        }
        .bar {
            width: 4px;
            background: #66c0f4;
            border-radius: 2px;
            animation: equalizer 0.5s infinite alternate;
        }
        /* Разная задержка для столбиков */
        .bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 18px; animation-delay: 0.3s; }
        .bar:nth-child(3) { height: 14px; animation-delay: 0.0s; }
        .bar:nth-child(4) { height: 8px; animation-delay: 0.4s; }

        @keyframes equalizer {
            0% { height: 5px; }
            100% { height: 20px; }
        }

        /* УРОВЕНЬ */
        .level-badge {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #66c0f4;
            border: 1px solid rgba(102, 192, 244, 0.3);
            font-weight: bold;
            transform: translateZ(25px);
        }
        .level-badge.gold-text { color: #ffd700; border-color: #ffd700; background: rgba(0,0,0,0.8); }

        /* АВАТАРКА */
        .avatar {
            width: auto; 
            max-width: 100%;      
            max-height: 250px;
            height: auto;         
            display: block;       
            margin: 0 auto 15px auto; 
            
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
            cursor: pointer;
            transform: translateZ(20px);
        }
        .avatar:active { transform: scale(0.95) translateZ(20px); }

        h1 { margin: 0; font-size: 2em; letter-spacing: 1px; transform: translateZ(15px); word-wrap: break-word;}
        
        .pro-title {
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        .typewriter {
            font-size: 1.1em;
            color: #c7d5e0;
            margin: 10px 0 30px 0;
            min-height: 1.5em;
            font-weight: 300; 
            transform: translateZ(10px);
        }

        .links { display: flex; flex-direction: column; gap: 15px; transform: translateZ(30px); }
        
        .btn {
            text-decoration: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            transition: 0.3s;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            font-size: 1.05em;
        }

        /* Кнопки */
        .tg-btn { background: rgba(42, 171, 238, 0.15); border: 1px solid rgba(42, 171, 238, 0.3); }
        .tg-btn:hover { background: rgba(42, 171, 238, 0.4); box-shadow: 0 0 20px rgba(42, 171, 238, 0.3); }

        .steam-btn { background: rgba(23, 26, 33, 0.6); border: 1px solid rgba(102, 192, 244, 0.3); }
        .steam-btn:hover { background: linear-gradient(45deg, #1b2838, #2a475e); box-shadow: 0 0 20px rgba(102, 192, 244, 0.3); }

        .ds-btn { background: rgba(88, 101, 242, 0.15); border: 1px solid rgba(88, 101, 242, 0.3); }
        .ds-btn:hover { background: rgba(88, 101, 242, 0.4); box-shadow: 0 0 20px rgba(88, 101, 242, 0.3); }

        /* СУНДУЧОК */
        .chest-btn {
            display: none;
            background: linear-gradient(45deg, #ffd700, #ffa500);
            border: 2px solid #fff;
            color: #333;
            text-shadow: none;
            animation: bounce 2s infinite;
        }
        .chest-btn:hover { box-shadow: 0 0 30px #ffd700; transform: scale(1.05); }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        /* Вылетающий XP */
        .float-xp {
            position: absolute;
            color: #66c0f4;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            font-size: 1.5em;
            z-index: 100;
            text-shadow: 0 0 5px black;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
        }
    </style>
</head>
<body>

    <div class="glass-card" id="main-card" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2">
        
        <div class="level-badge" id="lvl-badge">Lvl <span id="level-display">1</span></div>

        <div class="music-wrapper">
            <div class="mini-player" id="equalizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <button class="music-btn" onclick="toggleMusic()">🎵</button>
        </div>
        <audio id="bg-music" loop src="song.mp3"></audio>

        <img src="avatar.gif" alt="Avatar" class="avatar" onclick="clickXP(event)" onerror="this.src='https://via.placeholder.com/150?text=No+Gif';">
        
        <h1 id="nickname">KillBracker</h1>
        
        <div class="typewriter" id="typing-text"></div>

        <div class="links">
            <a href="https://t.me/KillBracker" target="_blank" class="btn tg-btn">✈️ Telegram</a>
            <a href="https://steamcommunity.com/id/lonelyobserver/" target="_blank" class="btn steam-btn">🎮 Steam Profile</a>
            <a href="https://discord.com/users/296367874933784579" target="_blank" class="btn ds-btn">👾 Discord: killbracker</a>
            
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="btn chest-btn" id="secret-chest">
                🎁 Секретная Награда
            </a>
        </div>
    </div>

    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

    <script>
        /* 1. ПЕЧАТНАЯ МАШИНКА */
        const words = ["Leveling Up...", "Lonely Observer", "Steam User", "Discord: killbracker"];
        let i = 0;
        let timer;
        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typing-text').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000); 
                    return false;
                };
                timer = setTimeout(loopTyping, 100); 
            };
            loopTyping();
        }
        function deletingEffect() {
            let word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typing-text').innerHTML = word.join("");
                } else {
                    if (words.length > (i + 1)) { i++; } else { i = 0; }
                    typingEffect();
                    return false;
                };
                timer = setTimeout(loopDeleting, 50); 
            };
            loopDeleting();
        }
        typingEffect();

        /* 2. МУЗЫКА И МИНИ-ПЛЕЕР */
        const music = document.getElementById("bg-music");
        const musicBtn = document.querySelector(".music-btn");
        const equalizer = document.getElementById("equalizer");
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.classList.remove("music-active");
                musicBtn.innerHTML = "🎵";
                equalizer.style.opacity = "0"; // Прячем эквалайзер
            } else {
                music.volume = 0.3;
                music.play().catch(e => console.log("Audio need interaction"));
                musicBtn.classList.add("music-active");
                musicBtn.innerHTML = "⏸️";
                equalizer.style.opacity = "1"; // Показываем эквалайзер
            }
            isPlaying = !isPlaying;
        }

        /* 3. XP СИСТЕМА (БЕЗ СОХРАНЕНИЯ) */
        let xp = 0; // Начинаем с 0 при каждой загрузке
        let hasCelebrated = false;
        
        // Обновляем дисплей сразу
        document.getElementById("level-display").innerText = "1";

        function clickXP(event) {
            xp++;
            
            const floatText = document.createElement("div");
            floatText.classList.add("float-xp");
            floatText.innerText = "+1 XP";
            floatText.style.left = event.clientX + "px";
            floatText.style.top = event.clientY + "px";
            document.body.appendChild(floatText);
            setTimeout(() => { floatText.remove(); }, 600);

            checkLevelEffects();
        }

        function checkLevelEffects() {
            let level = Math.floor(xp / 10) + 1;
            document.getElementById("level-display").innerText = level;

            if (level >= 10) {
                activateGoldMode();
                if (!hasCelebrated && level === 10) {
                    launchConfetti();
                    hasCelebrated = true;
                }
            }
        }

        function activateGoldMode() {
            document.body.classList.add("gold-mode");
            const nickElement = document.getElementById("nickname");
            nickElement.innerHTML = "👑 PRO KillBracker";
            nickElement.classList.add("pro-title");
            document.getElementById("main-card").classList.add("gold-border");
            document.getElementById("lvl-badge").classList.add("gold-text");
            document.getElementById("secret-chest").style.display = "flex";
        }

        function launchConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 999 };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }
            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
