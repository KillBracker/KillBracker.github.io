<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KillBracker | Links</title>
    <style>
        /* Живой фон */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh; /* Используем min-height чтобы на мобильных не обрезалось */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #1b2838, #2a475e, #0f111a, #5865F2);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: white;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Стеклянная карточка */
        .glass-card {
            background: rgba(23, 26, 33, 0.7); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            margin: 20px; /* Отступ чтобы на мобилках не прилипало к краям */
        }

        /* Аватарка */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #66c0f4; 
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(102, 192, 244, 0.6);
        }

        h1 { margin: 0; font-size: 2em; letter-spacing: 1px; }
        
        .typewriter {
            font-size: 1.1em;
            color: #c7d5e0;
            margin: 10px 0 30px 0;
            min-height: 1.5em;
            font-weight: 300; 
        }

        /* Кнопки ссылок */
        .links { display: flex; flex-direction: column; gap: 15px; }
        
        .btn {
            text-decoration: none;
            color: white;
            padding: 14px;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Стили кнопок */
        
        /* Telegram */
        .tg-btn {
            background: rgba(42, 171, 238, 0.2);
            border: 1px solid rgba(42, 171, 238, 0.4);
        }
        .tg-btn:hover {
            background: rgba(42, 171, 238, 0.6);
            box-shadow: 0 0 15px rgba(42, 171, 238, 0.4);
        }

        /* Steam */
        .steam-btn {
            background: rgba(23, 26, 33, 0.6);
            border: 1px solid rgba(102, 192, 244, 0.4);
        }
        .steam-btn:hover {
            background: linear-gradient(45deg, #1b2838, #2a475e);
            box-shadow: 0 0 15px rgba(102, 192, 244, 0.4);
        }

        /* Discord */
        .ds-btn {
            background: rgba(88, 101, 242, 0.2); /* Фирменный цвет Discord */
            border: 1px solid rgba(88, 101, 242, 0.4);
        }
        .ds-btn:hover {
            background: rgba(88, 101, 242, 0.6);
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
        }

        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="glass-card">
        <img src="avatar.gif" alt="Avatar" class="avatar" onerror="this.src='https://via.placeholder.com/150?text=No+Gif';">
        
        <h1>KillBracker</h1>
        
        <div class="typewriter" id="typing-text"></div>

        <div class="links">
            <a href="https://t.me/KillBracker" target="_blank" class="btn tg-btn">
                ✈️ Telegram
            </a>
            
            <a href="https://steamcommunity.com/id/lonelyobserver/" target="_blank" class="btn steam-btn">
                🎮 Steam Profile
            </a>

            <a href="https://discord.com/users/296367874933784579" target="_blank" class="btn ds-btn">
                👾 Discord: killbracker
            </a>
        </div>
    </div>

    <script>
        const words = ["Lonely Observer", "Steam User", "Discord: killbracker", "Welcome"];
        let i = 0;
        let timer;

        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typing-text').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000); 
                    return false;
                };
                timer = setTimeout(loopTyping, 100); 
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typing-text').innerHTML = word.join("");
                } else {
                    if (words.length > (i + 1)) { i++; } else { i = 0; }
                    typingEffect();
                    return false;
                };
                timer = setTimeout(loopDeleting, 50); 
            };
            loopDeleting();
        }

        typingEffect();
    </script>
</body>
</html>
